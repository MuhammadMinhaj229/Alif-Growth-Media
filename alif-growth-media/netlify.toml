# Netlify deploy config for this TanStack Start (Vite + Nitro) app.
#
# This is a server-rendered app, NOT a static site. When NETLIFY=true is set
# (Netlify sets it automatically), Nitro builds with its Netlify preset:
#   static assets  -> dist/
#   SSR handler    -> .netlify/functions-internal/server/
#   routing        -> dist/_redirects (catch-all to the server function)
#
# There is no `dist/client` in a Netlify build — that path only exists for the
# Cloudflare target used by Lovable hosting. If the Netlify UI has a publish
# directory set (Site settings -> Build & deploy -> Publish directory), clear
# it or set it to `dist`, because a UI value overrides this file.

[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"